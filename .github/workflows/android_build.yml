name: Android Nightly Build

on:
  schedule:
    # ทำงานทุกวันเวลา 00:00 UTC (07:00 น. เวลาไทย)
    - cron: '0 0 * * *'
  workflow_dispatch:  # กดรันเองได้

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits since last nightly
        id: check_new_commits
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "nightly-*" --sort=-v:refname | head -n 1)
          echo "Latest nightly tag: $LATEST_TAG"
          if [ -z "$LATEST_TAG" ]; then
            echo "No nightly tag found. Proceeding with build."
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            TAG_COMMIT=$(git rev-list -n 1 "$LATEST_TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            echo "Tag commit: $TAG_COMMIT"
            echo "HEAD commit: $HEAD_COMMIT"
            if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ] && [ "${{ github.event_name }}" = "schedule" ]; then
              echo "No new commits since last nightly tag and triggered by schedule. Skipping build."
              echo "skip=true" >> $GITHUB_OUTPUT
            else
              echo "Proceeding with build."
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up JDK 17
        if: steps.check_new_commits.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        if: steps.check_new_commits.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get current date
        if: steps.check_new_commits.outputs.skip != 'true'
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Check if today's nightly already exists
        if: steps.check_new_commits.outputs.skip != 'true'
        id: check_release
        run: |
          TAG_PREFIX="nightly-${{ steps.date.outputs.date }}"
          echo "Checking for tag: $TAG_PREFIX"
          if gh release view $TAG_PREFIX >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if nightly already exists
        if: steps.check_new_commits.outputs.skip != 'true' && steps.check_release.outputs.exists == 'true'
        run: echo "Nightly for today already exists. Skipping build."

      - name: Create .env file
        if: steps.check_new_commits.outputs.skip != 'true' && steps.check_release.outputs.exists == 'false'
        run: |
          cat > .env << EOF
          APPLOVIN_SDK_KEY=${{ secrets.APPLOVIN_SDK_KEY }}
          BANNER_AD_UNIT_ID=${{ secrets.BANNER_AD_UNIT_ID }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Get Flutter dependencies
        if: steps.check_new_commits.outputs.skip != 'true' && steps.check_release.outputs.exists == 'false'
        run: flutter pub get

      - name: Download Android Keystore
        if: steps.check_new_commits.outputs.skip != 'true' && steps.check_release.outputs.exists == 'false'
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: upload-keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build APK
        if: steps.check_new_commits.outputs.skip != 'true' && steps.check_release.outputs.exists == 'false'
        run: flutter build apk --release
        env:
          STORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build App Bundle
        if: steps.check_new_commits.outputs.skip != 'true' && steps.check_release.outputs.exists == 'false'
        run: flutter build appbundle --release
        env:
          STORE_FILE: ${{ steps.android_keystore.outputs.filePath }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Get short SHA
        if: steps.check_new_commits.outputs.skip != 'true' && steps.check_release.outputs.exists == 'false'
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create Nightly Release
        if: steps.check_new_commits.outputs.skip != 'true' && steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.date.outputs.date }}-${{ steps.sha.outputs.sha }}
          name: Nightly Build ${{ steps.date.outputs.date }}
          body: |
            🌙 **Nightly Build**

            **Date:** ${{ steps.date.outputs.date }}
            **Commit:** ${{ steps.sha.outputs.sha }}
            **Branch:** ${{ github.ref_name }}

            This is an automated nightly build. Use at your own risk!
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🧹 Cleanup old nightly releases (older than 7 days)
        if: always() && steps.check_new_commits.outputs.skip != 'true'
        run: |
          echo "Cleaning up nightly releases older than 7 days..."
          gh release list --limit 100 --json tagName,createdAt -q '.[] | select(.tagName | startswith("nightly-")) | [.tagName, .createdAt]' |
          while read -r line; do
            TAG=$(echo "$line" | awk '{print $1}' | tr -d '[]" ,')
            DATE=$(echo "$line" | awk '{print $2}' | tr -d '[]" ,')
            if [ -n "$DATE" ]; then
              SECONDS_OLD=$(( ($(date +%s) - $(date -d "$DATE" +%s)) / 86400 ))
              if [ "$SECONDS_OLD" -gt 7 ]; then
                echo "🗑️ Deleting old nightly: $TAG (Age: ${SECONDS_OLD} days)"
                gh release delete "$TAG" --yes || true
                gh tag delete "$TAG" || true
              fi
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
